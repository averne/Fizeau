name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v1
      with:
        submodules: recursive

    - name: Build
      run: |
        make -C common -j$(nproc)
        make dist -j$(nproc)

    - uses: actions/upload-artifact@master
      with:
        name: Fizeau
        path: out/Fizeau-*.zip
